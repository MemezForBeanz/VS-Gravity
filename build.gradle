plugins {
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.6.1' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.mod_group_id
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    // Forge keeps the historical "gravityapi" artifact name so existing dependents resolve it;
    // the other modules are suffixed (gravityapi-common, gravityapi-fabric).
    base {
        archivesName = project.name == 'forge' ? rootProject.mod_id : "$rootProject.mod_id-$project.name"
    }

    repositories {
        maven { url = "https://maven.bawnorton.com/releases" } // MixinSquared
        maven { url = "https://jitpack.io" }
        maven { url = "https://maven.valkyrienskies.org/" } // Valkyrien Skies 2 + VS core
        maven { url = "https://thedarkcolour.github.io/KotlinForForge/" } // Kotlin for Forge (VS2 runtime)
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" } // Forge Config API Port
        maven {
            url = "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }
        mavenCentral()
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.officialMojangMappings()
    }

    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
        }
    }

    java {
        // A library for any 1.20.1 pack, so it targets Java 17 even though Gradle runs on 21
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
        it.options.encoding = 'UTF-8'
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
                pom {
                    name = rootProject.mod_name
                    description = rootProject.mod_description
                    licenses { license { name = rootProject.mod_license } }
                }
            }
        }
        repositories {
            maven {
                name = 'localOutput'
                url "file://${rootProject.projectDir}/mcmodsrepo"
            }
            // Only registered when credentials are available, so a plain `./gradlew publish`
            // without a GitHub token still succeeds (it just publishes to localOutput)
            def ghUser = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            def ghToken = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
            if (ghUser && ghToken) {
                maven {
                    name = 'GitHubPackages'
                    url = uri("https://maven.pkg.github.com/${rootProject.github_repo}")
                    credentials {
                        username = ghUser
                        password = ghToken
                    }
                }
            }
        }
    }
}

// Fails the release if the pushed tag doesn't match mod_version in gradle.properties
tasks.register('checkReleaseTag') {
    def tag = providers.environmentVariable('GITHUB_REF_NAME')
    def expected = "v${mod_version}"
    doLast {
        if (tag.getOrNull() != expected) {
            throw new GradleException("Tag '${tag.getOrNull()}' does not match mod_version (expected '${expected}')")
        }
    }
}
