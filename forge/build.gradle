plugins {
    id 'com.gradleup.shadow'
    id 'me.modmuss50.mod-publish-plugin'
}

loom {
    forge {
        mixinConfig "gravityapi.mixin.json", "gravityapi.forge.mixin.json"
    }

    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
        client {
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration are bundled into the mod jar by Shadow
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$minecraft_version-$forge_version"
    modImplementation "dev.architectury:architectury-forge:$architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.7"))
    implementation(include("com.github.bawnorton.mixinsquared:mixinsquared-forge:0.3.7"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.5"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.5.5"))

    // Valkyrien Skies: optional at runtime (the integration is reflection-guarded)
    modImplementation("org.valkyrienskies:valkyrienskies-120-forge:$vs2_version") {
        exclude group: "org.valkyrienskies.core"
        exclude group: "maven.modrinth", module: "spark"
    }
    ["api", "internal", "util"].each {
        compileOnly("org.valkyrienskies.core:$it:$vscore_version") { exclude group: "org.joml" }
        forgeRuntimeLibrary("org.valkyrienskies.core:$it:$vscore_version") { exclude group: "org.joml" }
    }
    modLocalRuntime "thedarkcolour:kotlinforforge:4.12.0"

    // Ad Astra: compile-only for its public gravity events API (compat.planets.AdAstraCompat)
    modCompileOnly("maven.modrinth:ad-astra:$adastra_version") { transitive = false }
}

processResources {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

// CurseForge upload + GitHub Release, driven by the publish workflow on a v* tag.
// Without CURSEFORGE_TOKEN the whole thing runs as a dry run, so `./gradlew publishMods` is safe locally.
publishMods {
    file = remapJar.archiveFile
    displayName = "${mod_name} ${mod_version}"
    version = mod_version
    changelog = providers.environmentVariable('CHANGELOG').orElse("https://github.com/${github_repo}/releases/tag/v${mod_version}")
    type = STABLE
    modLoaders.add('forge')
    dryRun = providers.environmentVariable('CURSEFORGE_TOKEN').getOrNull() == null

    curseforge {
        projectId = curseforge_project_id
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_17)
        clientRequired = true
        serverRequired = true
        optional('valkyrien-skies')
    }

    github {
        repository = github_repo
        accessToken = providers.environmentVariable('GITHUB_TOKEN')
        commitish = providers.environmentVariable('GITHUB_SHA').orElse('main')
        tagName = "v${mod_version}"
        additionalFiles.from(remapSourcesJar.archiveFile)
    }
}
